<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LH47 — CRM</title>
<link rel="icon" href="/img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f12;--panel:#17191e;--line:#2a2d35;--text:#f2f2f2;--muted:#9aa0aa;--acc:#ff4002;--err:#ff6b5a;
  --s-new:#ff4002;--s-work:#f5b83d;--s-done:#3ccf8e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,.btn,.brand{font-family:Montserrat,sans-serif}
.btn{background:var(--acc);color:#fff;border:0;border-radius:4px;padding:12px 22px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--text);font:15px Inter,sans-serif;padding:12px 14px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
[hidden]{display:none!important}

/* login */
.login{min-height:100svh;display:grid;place-items:center;padding:16px}
.login form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:32px;display:grid;gap:16px}
.login img{width:52px}
.login h1{font-size:22px}
.login p{color:var(--muted);font-size:14px}
.err{color:var(--err);font-size:14px;min-height:20px}

/* app */
header{position:sticky;top:0;z-index:5;background:#0e0f12f2;border-bottom:1px solid var(--line)}
header .in{max-width:1480px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.06em;text-decoration:none;color:inherit;margin-right:auto}
.brand img{width:34px}
main{max-width:1480px;margin:0 auto;padding:24px 20px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:18px}
.bar h1{font-size:24px}
.bar .sum{color:var(--muted);font-size:14px}
.time{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:60px 0;border:1px dashed var(--line);border-radius:6px}

/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.col{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:360px;scroll-snap-align:start;transition:border-color .15s}
.col.over{border-color:var(--c);background:color-mix(in srgb,var(--c) 6%,var(--panel))}
.col h3{display:flex;align-items:center;gap:8px;font:600 13px Inter;letter-spacing:.04em;text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--line)}
.col h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.col h3 b{margin-left:auto;color:var(--muted);font-weight:500}
.cards{padding:8px;display:grid;gap:8px;align-content:start;flex:1}
.card{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:4px;padding:10px 12px;cursor:pointer;transition:border-color .2s}
.card:hover{border-color:#454a55;border-left-color:var(--c)}
.card[draggable=true]{cursor:grab}
.card.drag{opacity:.4}
.card.fresh{animation:fresh 2.5s}
@keyframes fresh{from{box-shadow:0 0 0 2px var(--acc)}}
.card b{display:block;font-weight:600;font-size:14px}
.card .phone{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.card .meta{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.src{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 6px;color:var(--text)}

/* detail */
.overlay{position:fixed;inset:0;background:#000a;z-index:20;display:flex;justify-content:flex-end}
.sheet{width:min(480px,100%);height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:28px;display:grid;gap:20px;align-content:start}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-size:24px}
.close{background:none;border:0;color:var(--muted);font-size:28px;cursor:pointer;line-height:1}
.field small{color:var(--muted);display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.field a{color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.comment{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:14px}
.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:4px;padding:11px 4px;font:500 13px Inter;cursor:pointer}
.st.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--text);font:15px/1.5 Inter,sans-serif;padding:12px 14px;outline:none}
textarea:focus{border-color:var(--acc)}
.sheet form{display:grid;gap:14px}
.sheet form input{width:100%}
.btn.sm{padding:9px 16px;font-size:12px;justify-self:start}
.drop{display:grid;place-items:center;gap:8px;text-align:center;border:1px dashed var(--line);border-radius:6px;padding:34px 16px;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--acc);color:var(--text)}
.drop b{font:600 15px Inter;color:var(--text)}
.drop input{display:none}
.preview{width:100%;max-height:240px;object-fit:contain;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.doc{display:inline-flex;align-items:center;gap:6px;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:8px 12px;text-decoration:none;font-size:14px}
.doc:hover{border-color:var(--acc)}
.hist{list-style:none;display:grid;gap:0;border-left:2px solid var(--line);margin-left:4px}
.hist li{position:relative;padding:0 0 12px 16px;display:flex;justify-content:space-between;gap:10px}
.hist li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.hist li:last-child{padding-bottom:0}
.saved{color:var(--muted);font-size:13px;min-height:18px}

@media (max-width:760px){
  .board{grid-template-columns:repeat(6,82vw);margin:0 -16px;padding:0 16px 8px;scroll-padding:0 16px}
  .col{min-height:60vh}
  main,header .in{padding-left:16px;padding-right:16px}
  .brand span{display:none}
  .btn{padding:11px 14px}
  .sheet{padding:22px 16px}
}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form id="loginForm">
    <img src="/img/logo.svg" alt="LH47">
    <h1>CRM LH47</h1>
    <p>Раздел для сотрудников. Введите пароль администратора.</p>
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn" type="submit">Войти</button>
  </form>
</div>

<div id="app" hidden>
  <header><div class="in">
    <a class="brand" href="/"><img src="/img/logo.svg" alt="LH47"><span>LH47 · CRM</span></a>
    <button class="btn ghost" id="scan">📇 Визитка</button>
    <button class="btn" id="add">+ Клиент</button>
    <button class="btn ghost" id="refresh">Обновить</button>
    <button class="btn ghost" id="logout">Выйти</button>
  </div></header>
  <main>
    <div class="bar">
      <h1>Воронка</h1>
      <span class="sum" id="sum"></span>
    </div>
    <div class="board" id="board"></div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<script>
// Этапы воронки — те же, что в api/_lib.py STAGES.
const STAGES = [['Новая', 'var(--acc)'], ['Связались', '#f5b83d'], ['Встреча', '#5aa9ff'],
  ['КП отправлено', '#b48cff'], ['Оплачено', '#3ccf8e'], ['Отказ', '#6b7280']];
const color = s => (STAGES.find(x => x[0] === s) || [0, 'var(--muted)'])[1];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const $ = id => document.getElementById(id);
const canDrag = matchMedia('(hover: hover) and (pointer: fine)').matches;  // на телефоне этап меняется в карточке
let leads = [], known = new Set(), dragging = null;

async function api(path, opts = {}) {
  const r = await fetch(path, {credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, ...opts});
  if (r.status === 401 && path !== '/api/login') { showLogin(); throw new Error('auth'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Ошибка сервера');
  return data;
}

function showLogin() { $('app').hidden = true; $('overlay').hidden = true; $('login').hidden = false; $('loginForm').password.focus(); }
function showApp() { $('login').hidden = true; $('app').hidden = false; load(); }

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  try {
    await api('/api/login', {method: 'POST', body: JSON.stringify({password: e.target.password.value})});
    e.target.reset(); showApp();
  } catch (err) { $('loginErr').textContent = err.message; }
});
$('logout').onclick = async () => { await api('/api/login', {method: 'DELETE'}); leads = []; showLogin(); };
$('refresh').onclick = () => load();
$('add').onclick = () => openNew();
$('scan').onclick = () => openScan();

async function load() {
  try {
    const data = await api('/api/leads');
    const first = known.size === 0;
    data.leads.forEach(l => { l.fresh = !first && !known.has(l.id); known.add(l.id); });
    leads = data.leads;
    render();
  } catch (err) {
    if (err.message !== 'auth') $('board').innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
}

function render() {
  const paid = leads.filter(l => l.status === 'Оплачено').length;
  $('sum').textContent = `${leads.length} клиентов · оплачено ${paid}`;
  $('board').innerHTML = STAGES.map(([s, c]) => {
    const list = leads.filter(l => l.status === s);
    return `<section class="col" data-s="${esc(s)}" style="--c:${c}">
      <h3>${esc(s)}<b>${list.length}</b></h3>
      <div class="cards">${list.map(l => `
        <div class="card${l.fresh ? ' fresh' : ''}" data-id="${l.id}" draggable="${canDrag}" style="--c:${c}">
          <b>${esc(l.name)}</b>
          <div class="phone">${esc(l.phone)}</div>
          <div class="meta"><span class="src">${esc(l.source)}${l.market === 'ru' ? ' · RU' : ''}</span><span>${esc(l.local_time.slice(0, 10))}</span></div>
        </div>`).join('')}</div>
    </section>`;
  }).join('');
}

$('board').onclick = e => { const c = e.target.closest('.card'); if (c) open(+c.dataset.id); };
$('board').addEventListener('dragstart', e => {
  const c = e.target.closest('.card'); if (!c) return;
  dragging = +c.dataset.id; c.classList.add('drag'); e.dataTransfer.effectAllowed = 'move';
});
$('board').addEventListener('dragend', () => { dragging = null; render(); });
$('board').addEventListener('dragover', e => {
  const col = e.target.closest('.col'); if (!col || dragging === null) return;
  e.preventDefault();
  document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over'));
  col.classList.add('over');
});
$('board').addEventListener('drop', e => {
  const col = e.target.closest('.col'); if (!col || dragging === null) return;
  e.preventDefault(); move(dragging, col.dataset.s);
});

async function save(id, body) {
  const {lead} = await api('/api/leads', {method: 'PATCH', body: JSON.stringify({id, ...body})});
  const l = leads.find(x => x.id === id);
  Object.assign(l, lead, {fresh: false});
  render();
  return l;
}

async function move(id, stage) {
  const l = leads.find(x => x.id === id);
  if (!l || l.status === stage) return render();
  l.status = stage; render();  // сразу показываем, сервер подтверждает
  try { await save(id, {status: stage}); }
  catch (err) { if (err.message !== 'auth') { alert(err.message); load(); } }
}

function open(id) {
  const l = leads.find(x => x.id === id);
  $('sheet').innerHTML = `
    <div class="top"><span class="time">Клиент № ${l.id}</span><button class="close" aria-label="Закрыть">×</button></div>
    <h2>${esc(l.name)}</h2>
    <div class="grid2">
      <div class="field"><small>Телефон</small><a href="tel:${esc(l.phone.replace(/[^\d+]/g, ''))}">${esc(l.phone)}</a></div>
      <div class="field"><small>Источник</small><span class="src">${esc(l.source)}</span>${l.market === 'ru' ? ' <span class="time">Россия</span>' : ''}</div>
      <div class="field"><small>Создан</small>${esc(l.local_time)}</div>
      <div class="field"><small>Этап</small><span style="color:${color(l.status)}">● </span>${esc(l.status)}</div>
    </div>
    ${l.comment ? `<div class="field"><small>${l.source === 'Визитка' ? 'С визитки' : 'Заявка'}</small><div class="comment">${esc(l.comment)}</div></div>` : ''}
    ${l.doc ? `<div class="field"><small>Оригинал</small><a class="doc" href="/api/card?id=${l.id}" target="_blank" rel="noopener">📇 Открыть визитку</a></div>` : ''}
    <div class="field"><small>Перевести на этап</small><div class="statuses">${STAGES.map(([s, c]) =>
      `<button class="st${l.status === s ? ' on' : ''}" style="--c:${c}" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
    <div class="field"><small>Заметки</small><textarea id="notes" placeholder="Договорились созвониться в пятницу, интересует дом 180 м²…">${esc(l.notes)}</textarea>
      <button class="btn sm" id="saveNotes" style="margin-top:8px">Сохранить заметку</button></div>
    <div class="saved" id="saved"></div>
    <div class="field"><small>История этапов</small><ol class="hist">${l.history.slice().reverse().map(h =>
      `<li style="--c:${color(h.stage)}"><span>${esc(h.stage)}</span><span class="time">${esc(h.local_time)}</span></li>`).join('')}</ol></div>`;
  $('overlay').hidden = false;
  $('sheet').querySelector('.close').onclick = close;
  const status = async (body, done) => {
    $('saved').textContent = 'Сохраняю…';
    try { await save(l.id, body); open(l.id); $('saved').textContent = done; }
    catch (err) { if (err.message !== 'auth') $('saved').textContent = err.message; }
  };
  $('sheet').querySelector('.statuses').onclick = e => {
    const b = e.target.closest('.st');
    if (b && b.dataset.s !== l.status) status({status: b.dataset.s}, 'Этап «' + b.dataset.s + '» сохранён');
  };
  $('saveNotes').onclick = () => status({notes: $('notes').value}, 'Заметка сохранена');
}

// Новый клиент вручную, или экран проверки распознанной визитки (card — поля от Claude, doc — сохранённый оригинал).
function openNew(card, doc, preview) {
  const v = k => esc(card ? card[k] : '');
  $('sheet').innerHTML = `
    <div class="top"><span class="time">Новый клиент · источник «${card ? 'Визитка' : 'Вручную'}»</span><button class="close" aria-label="Закрыть">×</button></div>
    <h2>${card ? 'Проверьте визитку' : 'Добавить клиента'}</h2>
    <p class="time">${card ? 'Claude распознал поля — поправьте, если что-то не так, и сохраните.' : 'После звонка или встречи.'} Клиент появится на этапе «Новая».</p>
    ${preview ? `<img class="preview" src="${preview}" alt="Визитка">` : ''}
    <form id="newForm">
      <input name="name" placeholder="Имя" required minlength="2" maxlength="80" autocomplete="off" value="${v('name')}">
      <input name="phone" placeholder="Телефон, например +373 69 123 456" required inputmode="tel" autocomplete="off" value="${v('phone')}">
      <textarea name="comment" placeholder="${card ? 'Компания, должность, email' : 'Что хочет клиент (необязательно)'}" maxlength="2000">${v('comment')}</textarea>
      <div class="err" id="newErr"></div>
      <button class="btn" type="submit">${card ? 'Сохранить в воронку' : 'Добавить в воронку'}</button>
    </form>`;
  $('overlay').hidden = false;
  $('sheet').querySelector('.close').onclick = close;
  $('newForm').elements.name.focus();
  $('newForm').onsubmit = async e => {
    e.preventDefault();
    const f = e.target; $('newErr').textContent = '';
    try {
      const {lead} = await api('/api/leads', {method: 'POST', body: JSON.stringify(
        {name: f.elements.name.value, phone: f.elements.phone.value, comment: f.elements.comment.value, doc})});
      known.add(lead.id); leads.unshift(lead); render(); open(lead.id);
      $('saved').textContent = 'Клиент добавлен';
    } catch (err) { if (err.message !== 'auth') $('newErr').textContent = err.message; }
  };
}

// Фото с телефона уменьшаем до 1600 px (визитке хватает, и запрос укладывается в лимит Vercel); PDF — как есть.
async function shrink(file) {
  if (file.type === 'application/pdf') return {mime: file.type, blob: file};
  const img = await createImageBitmap(file).catch(() => null);
  if (!img) throw new Error('Не удалось открыть файл. Загрузите фото (JPG, PNG) или PDF.');
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = Object.assign(document.createElement('canvas'), {width: Math.round(img.width * k), height: Math.round(img.height * k)});
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return {mime: 'image/jpeg', blob: await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85))};
}
const b64 = blob => new Promise((ok, no) => {
  const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(blob);
});

function openScan() {
  $('sheet').innerHTML = `
    <div class="top"><span class="time">Распознавание через Claude · источник «Визитка»</span><button class="close" aria-label="Закрыть">×</button></div>
    <h2>Визитка → клиент</h2>
    <p class="time">Сфотографируйте визитку после встречи или загрузите PDF. Claude прочитает имя и телефон, вы проверите — и клиент появится в воронке.</p>
    <label class="drop" id="drop"><span style="font-size:34px">📇</span><b>Сфотографировать или выбрать файл</b>
      <span>JPG, PNG или PDF до 3 МБ</span><input type="file" id="file" accept="image/*,application/pdf"></label>
    <div class="saved" id="scanState"></div>
    <div class="err" id="scanErr"></div>`;
  $('overlay').hidden = false;
  $('sheet').querySelector('.close').onclick = close;
  $('file').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    $('scanErr').textContent = ''; $('scanState').textContent = 'Claude читает визитку…'; $('drop').hidden = true;
    try {
      const {mime, blob} = await shrink(file);
      if (blob.size > 3300000) throw new Error('Файл больше 3 МБ — сожмите PDF или сделайте фото.');
      const {card, doc} = await api('/api/card', {method: 'POST', body: JSON.stringify({mime, file: await b64(blob)})});
      openNew(card, doc, mime.startsWith('image/') ? URL.createObjectURL(blob) : '');
    } catch (err) {
      if (err.message === 'auth') return;
      $('scanState').textContent = ''; $('scanErr').textContent = err.message; $('drop').hidden = false; e.target.value = '';
    }
  };
}

function close() { $('overlay').hidden = true; }
$('overlay').onclick = e => { if (e.target.id === 'overlay') close(); };
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
setInterval(() => { if (!$('app').hidden && $('overlay').hidden && dragging === null && document.visibilityState === 'visible') load(); }, 30000);

api('/api/login').then(d => d.admin ? showApp() : showLogin()).catch(showLogin);
</script>
</body>
</html>
